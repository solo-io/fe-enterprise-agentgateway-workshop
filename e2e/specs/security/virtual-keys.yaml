lab: labs/security/virtual-keys.md
description: label-discovered API keys with per-user, tiered and per-tenant token budgets
tier: t1-key
requires:
  - OPENAI_API_KEY
timeout: 900

steps:
  # Token counters live in ext-cache (Redis) and survive for the whole budget
  # hour, so a second run inside that hour would start already exhausted and the
  # isolation assertions would fail for the wrong reason. This is the lab's own
  # documented reset procedure, run up front to make the lab re-runnable.
  - probe: "clear rate limit counters left by an earlier run"
    script: |
      kubectl rollout restart deployment/ext-cache-enterprise-agentgateway \
        -n agentgateway-system
      kubectl rollout status deployment/ext-cache-enterprise-agentgateway \
        -n agentgateway-system --timeout=120s
    assert:
      - contains: "successfully rolled out"

  - section: "Set up the OpenAI backend"
    run: all

  - section: "Create per-user API keys"
    run: all

  # NOTE: mode Strict on the shared Gateway means every route on the baseline
  # requires an API key until this lab's Cleanup removes the policy.
  - section: "Configure API key authentication"
    run: all

  - section: "Test authentication"
    run: [1]

  - section: "Test authentication"
    run: [2]
    retry:
      attempts: 10
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "chat.completion"

  - section: "Test authentication"
    run: [3]
    assert:
      - status: 200
      - contains: "chat.completion"

  - section: "Test authentication"
    run: [4]
    assert:
      - status: 401

  # The lab's claim that the identity comes from the validated credential and not
  # from the client. If a client could set it, the whole budget model is bypassable.
  - probe: "user_id comes from the key, not from a client-supplied header"
    script: |
      curl -s -o /dev/null -w 'spoofed_header=%{http_code}\n' "http://$GATEWAY_IP:8080/openai" \
        -H 'content-type: application/json' \
        -H 'Authorization: Bearer sk-invalid-key' \
        -H 'x-user-id: alice' \
        -d '{"model":"gpt-5.4-nano","messages":[{"role":"user","content":"Hello!"}]}'
    assert:
      # An unknown key is rejected regardless of what the client asserts about
      # its identity, so there is no way to present a user_id the gateway trusts
      # without holding a valid key.
      - contains: "spoofed_header=401"

  - section: "Configure the token budget"
    run: all

  - section: "Create the token budget policy"
    run: all

  # entRateLimit needs a settle window after attach, and the global limiter uses
  # a fixed window, so the burst is retried as a unit rather than asserting on a
  # single call.
  - section: "Test budget isolation"
    run: [1]
    retry:
      attempts: 5
      delay: 10
      until: "HTTP 429"
    assert:
      - contains: "HTTP 200"
      - contains: "HTTP 429"

  - section: "Test budget isolation"
    run: [2]
    assert:
      - status: 200
      - contains: "chat.completion"

  # ---- Advanced: tiered budgets ----
  - section: "Tiered budgets based on user type"
    run: [1, 2, 3]

  - section: "Tiered budgets based on user type"
    run: [4]
    retry:
      attempts: 5
      delay: 10
      until: "HTTP 429"
    assert:
      - contains: "HTTP 200"
      - contains: "HTTP 429"

  # Alice is premium here, so her (tier, user_id) tuple is a different counter
  # from charlie's — this is the assertion that proves the tier came from the
  # key metadata rather than being ignored.
  - section: "Tiered budgets based on user type"
    run: [5]
    assert:
      - status: 200
      - contains: "chat.completion"

  # ---- Advanced: multi-tenant keys ----
  - section: "Multi-tenant virtual keys"
    run: [1, 2]

  # This block holds both the tenant-a burst and the tenant-b call, so both
  # halves of the claim are asserted against one output: 429s for tenant-a, and
  # a 200 status line from the final tenant-b request.
  - section: "Multi-tenant virtual keys"
    run: [3]
    retry:
      attempts: 5
      delay: 10
      until: "HTTP 429"
    assert:
      - contains: "HTTP 429"
      - status: 200
      - contains: "chat.completion"

cleanup:
  section: "Cleanup"
