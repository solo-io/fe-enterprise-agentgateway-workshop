lab: labs/routing/configure-routing-aws-bedrock-apikey.md
description: OpenAI, Anthropic and Google models on AWS Bedrock via a Bedrock API key
tier: t3-cloud
requires:
  - BEDROCK_API_KEY
timeout: 420

steps:
  - section: "Export AWS Bedrock API Key"
    run: none
    reason: placeholder export and a key echo; the harness resolves BEDROCK_API_KEY itself

  - section: "Create Kubernetes Secret"
    run: all

  - section: "Create AWS Bedrock Route and Models"
    run: all

  - section: "curl AWS Bedrock gpt-oss endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Haiku endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Opus endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Sonnet endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Gemma endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "View Metrics Endpoint"
    run: all
    retry:
      attempts: 3
      delay: 3
      until: "agentgateway_"
    assert:
      - contains: 'agentgateway_requests_total{'

  - section: "View Metrics and Traces in Grafana"
    run: none
    reason: browser step

  - section: "View Traces in the Solo UI"
    run: none
    reason: browser step

  - section: "View Access Logs"
    run: all
    assert:
      - contains: "agentgateway-proxy"

  - section: "(Optional) View Traces in Jaeger"
    run: none
    reason: OpenShift-only alternative to the Solo UI

cleanup:
  section: "Cleanup"
