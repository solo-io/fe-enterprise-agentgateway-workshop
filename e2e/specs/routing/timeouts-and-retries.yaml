lab: labs/routing/timeouts-and-retries.md
description: request timeout + 503 retry with backoff against an always-503 mock, verified via 504 and retry logs
tier: t0
requires: []
timeout: 600

# This lab temporarily scales the proxy to 1 replica (to make logs readable) and
# its Cleanup scales back to 2, so the baseline is restored. Cleanup runs from an
# EXIT trap, so that holds even if an assertion fails partway through.
steps:
  # blocks: [1] healthy mock  [2] mock with 100% server_error (503) injection.
  # The failing mock exists from the start on purpose: when a mock pod is
  # replaced mid-lab (scale to 0, or a rollout that turns on injection), the
  # gateway keeps the old pod's address for a while, the request hangs on
  # connect until the timeout, and no 503 ever reaches the retry policy.
  - section: "Create the Mock vLLM Servers"
    run: all
    wait: "--for=condition=Available deploy/mock-gpt-4o deploy/mock-gpt-4o-503 -n agentgateway-system --timeout=300s"

  - section: "Configure Route and Model"
    run: all

  - section: "Scale AgentGateway to 1 Replica"
    run: all
    wait: "--for=condition=Available deploy/agentgateway-proxy -n agentgateway-system --timeout=300s"

  # The removed pod drains for up to 60s and can still take requests from the
  # load balancer, and its access-log lines leave with it. The probes below
  # read `deploy/`, so every request must land on the pod that stays.
  - probe: "the proxy is down to the one pod the probes read"
    script: |
      for i in $(seq 1 60); do
        n=$(kubectl get pods -n agentgateway-system -l app.kubernetes.io/name=agentgateway-proxy \
          --no-headers 2>/dev/null | wc -l | tr -d ' ')
        [ "$n" = 1 ] && break
        sleep 2
      done
      echo "proxy_pods=$n"
    assert:
      - contains: "proxy_pods=1"

  # blocks: [1] apply 100ms timeout / 10 retries / 25ms backoff  [2] get policies
  - section: "Configure Timeout and Retry Policy"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: 'timeout-retry-policy.*True'
    assert:
      - matches: 'timeout-retry-policy\s+True\s+True'

  - section: "Test Baseline (Successful Request)"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "mock-gpt-4o"

  # blocks: [1] tail logs (pre-failure, nothing to assert)
  #         [2] the request to /openai-503 that should time out
  - section: "Trigger Timeout and Retry Behavior"
    run: [1]

  - section: "Trigger Timeout and Retry Behavior"
    run: [2]
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 50[04]"
    assert:
      - status: 504
      - contains: "request timeout"

  # The access log is logfmt (`retry.attempt=3 ... duration=101ms`): about 3
  # retries inside the 100ms budget and about 9 inside the 2s budget.
  #
  # The lab scales the proxy to 1 replica, and the second pod can still be
  # terminating when this runs. `kubectl logs -l` lists that pod and then fails
  # with `pods "..." not found` once it is gone, so read `deploy/`, which picks
  # one ready pod. The sort on the leading RFC3339 timestamp stays, so the probe
  # reads the newest 504 (no `--prefix`, which would sort on the pod name).
  - probe: "the 100ms budget allowed ~3 retries before the 504"
    script: |
      line="$(kubectl logs -n agentgateway-system deploy/agentgateway-proxy \
        --tail 40 | grep -E 'http.status=504' | sort | tail -1)"
      # Kept for the 2s probe below, which asserts the comparison rather than a
      # sampled attempt count. Blocks share one shell, so this carries forward.
      export E2E_ATT_100MS="$(grep -oE 'retry\.attempt=[0-9]+' <<<"$line" | cut -d= -f2)"
      echo "$line"
    assert:
      - contains: "reason=Timeout"
      - matches: 'retry\.attempt=[2-4]\b'
      - matches: 'duration=1[0-9]{2}ms'

  # blocks: [1] apply 2s / 200ms policy  [2] request  [3] logs
  - section: "Test Retry Backoff with Longer Timeout"
    run: [1]

  - section: "Test Retry Backoff with Longer Timeout"
    run: [2]
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 50[04]"
    assert:
      - status: 504
      - contains: "request timeout"

  - section: "Test Retry Backoff with Longer Timeout"
    run: [3]
    assert:
      - contains: "agentgateway-proxy"

  # The always-503 mock answers at once, so the retry count is fixed by the
  # backoff: measured 9 retries in the 2s window and 3 in the 100ms window on
  # every run. The 7-10 band allows for scheduling jitter on a busy node and
  # still fails if the policy stopped retrying.
  - probe: "the 2s timeout took effect and ran the full window"
    script: |
      line="$(kubectl logs -n agentgateway-system deploy/agentgateway-proxy \
        --tail 60 | grep -E 'http.status=504' | sort | tail -1)"
      echo "$line"
      echo "attempts_2s=$(grep -oE 'retry\.attempt=[0-9]+' <<<"$line" | cut -d= -f2 || true) attempts_100ms=${E2E_ATT_100MS:-unset}"
    assert:
      - contains: "http.status=504"
      - contains: "reason=Timeout"
      - matches: 'duration=200[0-9]ms'
      - matches: 'retry\.attempt=([7-9]|10)\b'

cleanup:
  section: "Cleanup"
