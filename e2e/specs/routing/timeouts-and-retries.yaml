lab: labs/routing/timeouts-and-retries.md
description: request timeout + 503 retry with backoff, verified via 504 and retry logs
tier: t0
requires: []
timeout: 600

# This lab temporarily scales the proxy to 1 replica (to make logs readable) and
# its Cleanup scales back to 2, so the baseline is restored. Cleanup runs from an
# EXIT trap, so that holds even if an assertion fails partway through.
steps:
  - section: "Create a Mock vLLM Server"
    run: all
    wait: "--for=condition=Available deploy/mock-gpt-4o -n agentgateway-system --timeout=300s"

  - section: "Configure Route and Backend"
    run: all

  - section: "Scale AgentGateway to 1 Replica"
    run: all
    wait: "--for=condition=Available deploy/agentgateway-proxy -n agentgateway-system --timeout=300s"

  # blocks: [1] apply 100ms timeout / 10 retries / 25ms backoff  [2] get policies
  - section: "Configure Timeout and Retry Policy"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: 'timeout-retry-policy.*True'
    assert:
      - matches: 'timeout-retry-policy\s+True\s+True'

  - section: "Test Baseline (Successful Request)"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "mock-gpt-4o"

  # blocks: [1] tail logs (pre-failure, nothing to assert)  [2] scale mock to 0
  #         [3] the request that should now time out
  - section: "Trigger Timeout and Retry Behavior"
    run: [1, 2]

  - section: "Trigger Timeout and Retry Behavior"
    run: [3]
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 50[04]"
    assert:
      - status: 504
      - contains: "request timeout"

  # The access log is logfmt (`retry.attempt=3 ... duration=102ms`), not the JSON
  # object the lab prints as its expected output. The lab's *numbers* are right:
  # ~3 retries inside the 100ms budget, ~7 inside the 2s budget.
  #
  # `kubectl logs -l` concatenates the pods one after another, so a bare `tail -1`
  # returns the last line of whichever pod is listed last, not the newest 504.
  # Sort on the leading RFC3339 timestamp instead — which means no `--prefix`,
  # since that would put the pod name ahead of the timestamp in the sort key.
  - probe: "the 100ms budget allowed ~3 retries before the 504"
    script: |
      line="$(kubectl logs -n agentgateway-system -l app.kubernetes.io/name=agentgateway-proxy \
        --tail 40 | grep -E 'http.status=504' | sort | tail -1)"
      # Kept for the 2s probe below, which asserts the comparison rather than a
      # sampled attempt count. Blocks share one shell, so this carries forward.
      export E2E_ATT_100MS="$(grep -oE 'retry\.attempt=[0-9]+' <<<"$line" | cut -d= -f2)"
      echo "$line"
    assert:
      - contains: "reason=Timeout"
      - matches: 'retry\.attempt=[2-4]\b'
      - matches: 'duration=1[0-9]{2}ms'

  # blocks: [1] apply 2s / 200ms policy  [2] request  [3] logs
  - section: "Test Retry Backoff with Longer Timeout"
    run: [1]

  - section: "Test Retry Backoff with Longer Timeout"
    run: [2]
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 50[04]"
    assert:
      - status: 504
      - contains: "request timeout"

  - section: "Test Retry Backoff with Longer Timeout"
    run: [3]
    assert:
      - contains: "agentgateway-proxy"

  # Deliberately does NOT assert a retry count. The policy retries `codes: [503]`
  # only, and the lab produces failure by scaling the mock to 0 — so whether the
  # proxy answers a zero-endpoint Service with a quick 503 (retried, many
  # attempts) or simply hangs until the request timeout (no retry at all, and no
  # `retry.attempt` field in the log) is a race. Three runs on this cluster
  # measured 7, 4, and none, so any count assertion here — a sampled `[5-9]`, a
  # bracketed `[3-9]`, or even "at least as many as the 100ms budget" — fails for
  # reasons that have nothing to do with the gateway working.
  #
  # What IS invariant is the timeout: the request runs the full ~2s window, which
  # is exactly what proves the new policy took effect, since the 100ms policy caps
  # the same request at ~1xx ms. The retry count is echoed for diagnosis only.
  # The lab's documented `retry.attempt=7` is likewise only one sample — see
  # HANDOFF §8.
  - probe: "the 2s timeout took effect and ran the full window"
    script: |
      line="$(kubectl logs -n agentgateway-system -l app.kubernetes.io/name=agentgateway-proxy \
        --tail 60 | grep -E 'http.status=504' | sort | tail -1)"
      echo "$line"
      echo "attempts_2s=$(grep -oE 'retry\.attempt=[0-9]+' <<<"$line" | cut -d= -f2 || true) attempts_100ms=${E2E_ATT_100MS:-unset}"
    assert:
      - contains: "http.status=504"
      - contains: "reason=Timeout"
      - matches: 'duration=200[0-9]ms'

cleanup:
  section: "Cleanup"
