lab: labs/routing/configure-openai-embeddings.md
description: one AgentgatewayModel serving chat/embeddings/models by path, plus a path-prefix rule
tier: t1-key
requires:
  - OPENAI_API_KEY
timeout: 420

steps:
  - section: "Configure Required Variables"
    run: all

  - section: "Test OpenAI Chat Completions and Embeddings"
    run: all

  - section: "Test Chat Completions"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "chat.completion"
      - matches: '"model": *"gpt-5\.4-nano'

  - section: "Test /embeddings endpoint"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      # The documented embeddings response shape. Matched with a regex because
      # OpenAI returns embeddings as compact JSON but /v1/models pretty-printed,
      # so the space after the colon is not something a spec can rely on.
      - matches: '"object": *"list"'
      - matches: '"object": *"embedding"'
      - contains: "text-embedding-3-small"

  - section: "Test /models endpoint"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - matches: '"object": *"list"'
      - matches: '"object": *"model"'

  - section: "Compare access logs across endpoints"
    run: all
    assert:
      - contains: "agentgateway-proxy"

  # The lab's claim: chat and embeddings are both logged as LLM traffic with
  # their own operation name and cost, and /v1/models is a direct response.
  # Asserted per-line, so a chat line cannot satisfy an embeddings expectation.
  - probe: "chat and embeddings log gen_ai telemetry; /v1/models is a direct response"
    script: |
      logs=$(kubectl logs -n agentgateway-system \
               -l app.kubernetes.io/name=agentgateway-proxy --tail 200)
      chat=$(grep 'http.path=/v1/chat/completions' <<<"$logs" | sort | tail -1)
      emb=$(grep 'http.path=/v1/embeddings' <<<"$logs" | sort | tail -1)
      mod=$(grep 'http.path=/v1/models' <<<"$logs" | sort | tail -1)
      for f in gen_ai.operation.name=chat gen_ai.request.model gen_ai.usage.output_tokens \
               agw.ai.usage.cost.total; do
        grep -q "$f" <<<"$chat" && echo "chat has $f" || echo "chat MISSING $f"
      done
      for f in gen_ai.operation.name=embeddings gen_ai.usage.input_tokens agw.ai.usage.cost.total; do
        grep -q "$f" <<<"$emb" && echo "embeddings has $f" || echo "embeddings MISSING $f"
      done
      grep -q 'reason=DirectResponse' <<<"$mod" && echo "models is DirectResponse"
    retry:
      attempts: 6
      delay: 5
      until: "chat has gen_ai.operation.name=chat"
    assert:
      - contains: "chat has gen_ai.operation.name=chat"
      - contains: "chat has agw.ai.usage.cost.total"
      - contains: "embeddings has gen_ai.operation.name=embeddings"
      - contains: "embeddings has agw.ai.usage.cost.total"
      - contains: "models is DirectResponse"
      - not_contains: "MISSING"

  - section: "View Access Logs"
    run: all
    assert:
      - contains: "agentgateway-proxy"

  - section: "Advanced: Serve the APIs Under a Path Prefix"
    run: all

  - section: "Test with Prefixed Paths"
    run: [1]
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "chat.completion"

  - section: "Test with Prefixed Paths"
    run: [2]
    assert:
      - status: 200
      - matches: '"object": *"embedding"'

  - section: "Test with Prefixed Paths"
    run: [3]
    assert:
      - status: 200
      - matches: '"object": *"model"'

  # The lab's closing claim that the trailing catch-all rule keeps the standard
  # OpenAI paths working alongside the rewrites.
  - section: "Test with Prefixed Paths"
    run: [4]
    assert:
      - status: 200
      - contains: "chat.completion"

  # The prefixed path must still be parsed as LLM traffic once the prefix is
  # stripped, or /openai/... would lose token telemetry.
  - probe: "the prefixed chat path is still logged as an LLM completion"
    script: |
      kubectl logs -n agentgateway-system \
        -l app.kubernetes.io/name=agentgateway-proxy --tail 200 \
        | grep 'http.path=/openai/v1/chat/completions' | sort | tail -1
    retry:
      attempts: 6
      delay: 5
      until: "gen_ai.operation.name=chat"
    assert:
      - contains: "gen_ai.operation.name=chat"
      - matches: 'gen_ai\.usage\.output_tokens=[1-9]'

cleanup:
  section: "Cleanup"
