lab: labs/routing/configure-routing-aws-bedrock.md
description: OpenAI, Anthropic and Google models on AWS Bedrock via session credentials
tier: t3-cloud
requires:
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY
  - AWS_SESSION_TOKEN
timeout: 420

steps:
  # Block 1 overwrites the credentials with placeholder text and block 2 echoes
  # them into the run artifacts. The harness resolves the variables itself.
  - section: "Export AWS Credentials"
    run: [3, 4]

  - section: "curl AWS Bedrock gpt-oss endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Haiku endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Opus endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Sonnet endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "curl AWS Bedrock Gemma endpoint"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # A billed token count means Bedrock answered, not a gateway fallback.
      - matches: '"(prompt|input)_tokens": *[1-9]'

  - section: "View Metrics Endpoint"
    run: all
    retry:
      attempts: 3
      delay: 3
      until: "agentgateway_"
    assert:
      - contains: 'agentgateway_requests_total{'

  - section: "View Metrics and Traces in Grafana"
    run: none
    reason: browser step

  - section: "View Traces in the Solo UI"
    run: none
    reason: browser step

  - section: "View Access Logs"
    run: all
    assert:
      - contains: "agentgateway-proxy"

  - section: "(Optional) View Traces in Jaeger"
    run: none
    reason: OpenShift-only alternative to the Solo UI

cleanup:
  section: "Cleanup"
