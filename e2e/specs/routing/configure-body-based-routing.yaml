lab: labs/routing/configure-body-based-routing.md
description: AgentgatewayModel match.model routes on the body model; a * model catches unknown names
tier: t1-key
requires:
  - OPENAI_API_KEY
timeout: 480

steps:
  - section: "Deploy the Mock LLM Server"
    run: all
    wait: "--for=condition=Available deploy/mock-gpt-4o -n agentgateway-system --timeout=240s"

  - section: "Configure Required Variables"
    run: all

  - section: "Create the Route and Models"
    run: all

  - section: "Test Model-Name Routing"
    run: all
    assert:
      - contains: "Gateway IP:"

  - section: "Route to OpenAI"
    run: all
    retry:
      attempts: 10
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      # The dated build proves this reached OpenAI, not the mock — the whole
      # point of the routing decision under test.
      - matches: '"model": *"gpt-5\.4-nano-[0-9]{4}-[0-9]{2}-[0-9]{2}'
      - not_contains: "mock-gpt-4o"

  - section: "Route to Mock LLM"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "mock-gpt-4o"
      - not_contains: "gpt-5.4-nano"

  - section: "Fallback: Unknown Model"
    run: all
    retry:
      attempts: 6
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      # An unclaimed name must reach the mock through the * model, which also
      # proves the exact matches take precedence over the wildcard.
      - contains: "mock-gpt-4o"

  - probe: "a request with no model field is rejected, as the lab states"
    script: |
      curl -s -o /dev/null -w 'no-model -> %{http_code}\n' "$GATEWAY_IP:8080/openai/v1/chat/completions" \
        -H 'content-type: application/json' \
        -d '{"messages":[{"role":"user","content":"hi"}]}'
    assert:
      - contains: "no-model -> 400"

  # Assert the model each request was sent as, from the access log of the route.
  - probe: "each request matched the model its body implied"
    script: |
      kubectl logs -n agentgateway-system \
        -l app.kubernetes.io/name=agentgateway-proxy --tail 200 \
        | grep 'route=agentgateway-system/body-based-routing' \
        | grep -oE 'gen_ai.request.model=[a-z0-9.-]+' | sort | uniq -c \
        | sed 's/^ *//'
    retry:
      attempts: 6
      delay: 5
      until: "gen_ai.request.model=mock-gpt-4o"
    assert:
      - contains: "gen_ai.request.model=mock-gpt-4o"
      - contains: "gen_ai.request.model=gpt-5.4-nano"

  - section: "View Metrics Endpoint"
    run: all
    retry:
      attempts: 3
      delay: 3
      until: "agentgateway_"
    assert:
      - matches: 'agentgateway_[a-z_]+[{ ]'

  - section: "View Metrics and Traces in Grafana"
    run: none
    reason: foreground port-forward plus a browser step

  - section: "View Traces in the Solo UI"
    run: none
    reason: foreground port-forward plus a browser step

  - section: "View Access Logs"
    run: all
    assert:
      - contains: "agentgateway-proxy"

  - section: "(Optional) View Traces in Jaeger"
    run: none
    reason: OpenShift-only alternative to the Solo UI

cleanup:
  section: "Cleanup"
