lab: labs/transformations/transformations.md
description: CEL response transformations inject request/response context as headers
tier: t1-key
requires:
  - OPENAI_API_KEY
timeout: 360

steps:
  - section: "Lab Objectives"
    run: all

  - section: "curl openai"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "choices"
      # Baseline for the transformation steps: the header is absent until the
      # policy is applied, so a later PASS cannot come from a stale response.
      - not_contains: "x-user-id:"

  # NOTE: this policy targets the shared agentgateway-proxy Gateway, so it is a
  # temporary baseline mutation. The lab's own Cleanup removes it, and the
  # runner's Gateway fingerprint check confirms the baseline survives.
  - section: "Apply response transformation"
    run: [1]

  - section: "Apply response transformation"
    run: [2]
    retry:
      attempts: 8
      delay: 3
      until: "x-user-id: bob"
    assert:
      - status: 200
      - contains: "x-user-id: bob"

  # The lab states this in prose but gives the reader no block to run it with.
  - probe: "the default() expression falls back to anonymous with no x-user-id"
    script: |
      curl -si "http://$GATEWAY_IP:8080/openai" \
        -H 'content-type: application/json' \
        -d '{"model":"gpt-5.4-nano","messages":[{"role":"user","content":"hi"}]}' \
        | grep -i '^x-user-id:'
    assert:
      - contains: "x-user-id: anonymous"

  - section: "Extending our example"
    run: [1]

  - section: "Extending our example"
    run: [2]
    retry:
      attempts: 8
      delay: 3
      until: "x-request-path: /openai"
    assert:
      - status: 200
      - contains: "x-user-id: anonymous"
      - contains: "x-llm-request-model: gpt-5.4-nano"
      - contains: "x-request-method: POST"
      - contains: "x-request-path: /openai"
      # The lab's point is that the response model is the dated build, not the
      # alias the client asked for. Assert the difference, not just presence.
      - matches: 'x-llm-response-model: gpt-5\.4-nano-[0-9]{4}-[0-9]{2}-[0-9]{2}'

cleanup:
  section: "Cleanup"
