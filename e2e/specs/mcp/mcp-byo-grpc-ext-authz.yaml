lab: labs/mcp/mcp-byo-grpc-ext-authz.md
description: route-scoped BYO gRPC ext-authz gating MCP traffic on a header
tier: t0
requires: []
timeout: 700

steps:
  - section: "Deploy the ext-authz server"
    run: all
    wait: "--for=condition=Available deploy/grpc-ext-authz -n agentgateway-system --timeout=300s"

  - section: "Set up the MCP route"
    run: all
    wait: "--for=condition=Available deploy/mcp-server-everything -n mcp --timeout=300s"

  # blocks: [1] export GATEWAY_IP  [2] initialize with no ext-authz in play
  - section: "Verify the MCP route works without ext-authz"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "mcp-session-id"

  - section: "Create the ext-authz policy"
    run: all

  # blocks: [1] the denied request  [2] ext-authz server logs
  - section: "Test: MCP request denied without required header"
    run: [1]
    retry:
      attempts: 10
      delay: 4
      until: "HTTP/[0-9.]+ 403"
    assert:
      - status: 403
      - contains: "denied by ext_authz"
      - contains: "x-ext-authz-check-result: denied"

  - section: "Test: MCP request denied without required header"
    run: [2]
    assert:
      - contains: "mode=header"
      - contains: "DENIED"
      - contains: "/mcp"

  - section: "Test: MCP request allowed with required header"
    run: all
    retry:
      attempts: 8
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "mcp-session-id"

  # The policy targets the HTTPRoute, not the Gateway — that is the whole point of
  # the lab, so prove an unrelated path is not gated by it.
  - probe: "ext-authz is route-scoped: other paths are unaffected"
    script: |
      kubectl apply -f - >/dev/null <<'YAML'
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: extauthz-scope-check
        namespace: agentgateway-system
      spec:
        parentRefs:
          - name: agentgateway-proxy
            namespace: agentgateway-system
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /scope-check
      ---
      apiVersion: agentgateway.dev/v1alpha1
      kind: AgentgatewayPolicy
      metadata:
        name: extauthz-scope-check
        namespace: agentgateway-system
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: extauthz-scope-check
        traffic:
          directResponse:
            status: 200
            body: "unguarded"
      YAML
      for i in $(seq 1 10); do
        OUT="$(curl -s "http://$GATEWAY_IP:8080/scope-check")"
        [[ "$OUT" == *unguarded* ]] && break
        sleep 3
      done
      echo "scope_check=$OUT"
      kubectl delete httproute extauthz-scope-check -n agentgateway-system --ignore-not-found >/dev/null
      kubectl delete agentgatewaypolicy extauthz-scope-check -n agentgateway-system --ignore-not-found >/dev/null
    assert:
      - contains: "scope_check=unguarded"

  - section: "Combining ext-authz with MCP authorization"
    run: none
    reason: illustrative YAML snippet, not an applied manifest

cleanup:
  section: "Cleanup"
