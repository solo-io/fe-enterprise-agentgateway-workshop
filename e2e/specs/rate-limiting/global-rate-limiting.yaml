lab: labs/rate-limiting/global-rate-limiting.md
description: entRateLimit global counters — REQUEST vs TOKEN, header, multi-header, JWT claim, tier, IP, and mixed windows
tier: t1-key
timeout: 1500
requires:
  - OPENAI_API_KEY

steps:
  # This lab's first two limits use HOUR windows and every counter lives in
  # ext-cache Redis, so a second run inside the hour would start exhausted and
  # the 200-then-429 patterns would collapse to 429-only. This is the reset the
  # lab documents for exactly that situation.
  - probe: "clear rate limit counters left by an earlier run"
    script: |
      kubectl rollout restart deployment/ext-cache-enterprise-agentgateway \
        -n agentgateway-system
      kubectl rollout status deployment/ext-cache-enterprise-agentgateway \
        -n agentgateway-system --timeout=120s
    assert:
      - contains: "successfully rolled out"

  - section: "Lab Objectives"
    run: all

  - section: "Get the gateway address and curl openai"
    run: all
    retry:
      attempts: 10
      delay: 3
      until: "HTTP/[0-9.]+ 200"
    assert:
      - status: 200
      - contains: "chat.completion"

  # ---- REQUEST-based: counts calls, not tokens ----
  - section: "Configure a global REQUEST-based rate limit of 5 requests per hour"
    run: all

  # The policy takes a few seconds to reach the proxy after `kubectl apply`. A
  # retry on the measured loop would spend the 5-per-hour budget while the
  # policy is still arriving, and the attempt the harness keeps starts at 429.
  # So wait for enforcement here, then clear the counter and run the measured
  # loop once from zero. FLUSHALL empties Redis in place: a `rollout restart`
  # of ext-cache (the lab's documented reset, used at the top of this spec)
  # leaves the rate limiter failing open while it reconnects, so the first
  # request after it returned 500 and the next five returned 200 uncounted.
  # The loop below also waits out that window from the opening restart.
  - probe: "the 5-per-hour limit is enforced; clear its counter before the measured run"
    script: |
      for i in $(seq 1 30); do
        code=$(curl -s -o /dev/null -w '%{http_code}' "$GATEWAY_IP:8080/openai/v1/chat/completions" \
          -H 'content-type: application/json' \
          -d '{"model":"gpt-5.4-nano","messages":[{"role":"user","content":"hi"}]}')
        [ "$code" = 429 ] && break
        sleep 2
      done
      echo "enforced_after=$i last=$code"
      kubectl exec -n agentgateway-system deploy/ext-cache-enterprise-agentgateway -- redis-cli FLUSHALL
    assert:
      - contains: "last=429"
      - contains: "OK"

  - section: "curl openai until the request limit trips"
    run: [1]
    assert:
      - contains: "request 1: HTTP 200"
      # 5/hour, so the sixth call is the first rejection.
      - contains: "request 6: HTTP 429"

  - section: "curl openai until the request limit trips"
    run: [2]

  # ---- TOKEN-based: counts input tokens ----
  - section: "Configure global token-based rate limit of 10 input tokens per hour"
    run: all

  - section: "curl openai until the token limit trips"
    run: all
    retry:
      attempts: 4
      delay: 10
      until: "HTTP 429"
    assert:
      - contains: "request 1: HTTP 200"
      - contains: "HTTP 429"

  # ---- Header-based: self-asserted identity ----
  - section: "Configure header-based token rate limiting"
    run: all

  - section: "Test header-based rate limiting"
    run: [1]
    retry:
      attempts: 8
      delay: 5
      until: "HTTP/[0-9.]+ (200|429)"
    assert:
      - matches: 'HTTP/[0-9.]+ (200|429)'

  - section: "Test header-based rate limiting"
    run: [2]
    assert:
      - matches: 'HTTP/[0-9.]+ (200|429)'

  # A bare request.headers["x-user-id"] lookup returns a list for a repeated
  # header, the descriptor is dropped and the call is never limited. The lab's
  # join() form must still trip the 100-token budget when the header repeats.
  - probe: "a repeated X-User-ID header is still rate limited"
    script: |
      U="dup-$RANDOM"; CODES=""
      for i in $(seq 1 20); do
        CODES="$CODES $(curl -s -o /dev/null -w '%{http_code}' "$GATEWAY_IP:8080/openai/v1/chat/completions" \
          -H 'content-type: application/json' -H "X-User-ID: $U" -H "X-User-ID: $U" \
          -d '{"model":"gpt-5.4-nano","messages":[{"role":"user","content":"Whats your favorite poem?"}]}')"
        [[ "$CODES" == *429* ]] && break
      done
      echo "codes=$CODES"
    assert:
      - contains: "429"

  # ---- Multi-header composite descriptor ----
  - section: "Configure multi-header based token rate limiting"
    run: all

  - section: "Test multi-header rate limiting"
    run: all
    retry:
      attempts: 8
      delay: 5
      until: 'HTTP/[0-9.]+ (200|429)'
    assert:
      - matches: 'HTTP/[0-9.]+ (200|429)'

  # ---- JWT claim-based: identity the client cannot forge ----
  - section: "Configure JWT claim-based token rate limiting"
    run: all

  - section: "Mint two user tokens"
    run: all
    assert:
      # The generator signs locally with lib/jwt keys; confirm the decoded claim
      # the descriptor keys off.
      - contains: "analyst-user"

  - section: "Test JWT claim-based rate limiting"
    run: [1]
    retry:
      attempts: 10
      delay: 3
      until: "authentication failed|401"
    assert:
      # JWT validation rejects before the rate limiter is consulted at all.
      - status: 401
      - contains: "authentication failed"

  - section: "Test JWT claim-based rate limiting"
    run: [2]
    retry:
      attempts: 4
      delay: 15
      until: "HTTP 429"
    assert:
      - contains: "User A request 1: HTTP 200"
      - contains: "HTTP 429"

  # The lab's central claim for this section: User B's counter is untouched by
  # User A's exhaustion. The block exhausts User A itself, so it holds in any
  # clock-minute window. A retry covers a window reset between User A's two
  # requests.
  - section: "Verify independent per-user counters"
    run: all
    retry:
      attempts: 4
      delay: 5
      until: "User A request 2: HTTP 429"
    assert:
      - contains: "User A request 2: HTTP 429"
      - contains: "User B: HTTP 200"

  # And the security claim: a header cannot move you to a different counter,
  # because the descriptor value comes from the signed claim. The block spends
  # User A's quota first, so a clock-minute reset before it cannot turn the
  # spoofed request into a 200. A retry covers a reset between the two requests.
  - section: "The claim cannot be spoofed"
    run: all
    retry:
      attempts: 4
      delay: 3
      until: "User A with X-User-ID: someone-else: HTTP 429"
    assert:
      - contains: "User A with X-User-ID: someone-else: HTTP 429"

  - section: "Composite keys: rate limit on multiple JWT claims"
    run: all

  # ---- Tier-based quotas from a plan claim ----
  - section: "Configure tier-based token quotas"
    run: all

  - section: "Mint tier tokens"
    run: all

  - section: "Test tier-based rate limiting"
    run: [1]
    retry:
      attempts: 4
      delay: 15
      until: "HTTP 429"
    assert:
      - contains: "Request 1: HTTP 200"
      - contains: "HTTP 429"

  - section: "Test tier-based rate limiting"
    run: [2]
    retry:
      attempts: 6
      delay: 5
      until: "HTTP/[0-9.]+ 200"
    assert:
      # plan=premium is a different descriptor value, so a different counter.
      - status: 200
      - contains: "chat.completion"

  # ---- IP-based: fires before any identity check ----
  - section: "Configure IP-based token limiting"
    run: all

  - section: "Test IP-based rate limiting"
    run: all
    retry:
      attempts: 4
      delay: 15
      until: "HTTP 429"
    assert:
      # No Authorization header anywhere, yet the limiter still counts — the
      # distinguishing property of the IP descriptor.
      - contains: "Request 1: HTTP 200"
      - contains: "HTTP 429"
      - not_contains: "authentication failed"

  # ---- Mixed windows: minute burst plus hourly sustained ----
  - section: "Configure mixed time windows (burst + sustained)"
    run: all

  # blocks: [1] mint USER_TOKEN  [2] the burst loop
  - section: "Phase 1: exhaust the per-minute burst"
    run: [1]

  # Same reason as the REQUEST probe above: Phase 2 needs the hourly counter
  # to hold only what Phase 1 spent, so a retried Phase 1 would break it.
  - probe: "the mixed-window limits are enforced; clear their counters before Phase 1"
    script: |
      for i in $(seq 1 30); do
        code=$(curl -s -o /dev/null -w '%{http_code}' "$GATEWAY_IP:8080/openai/v1/chat/completions" \
          -H 'content-type: application/json' \
          -H "Authorization: Bearer $USER_TOKEN" \
          -d '{"model":"gpt-5.4-nano","messages":[{"role":"user","content":"hi"}]}')
        [ "$code" = 429 ] && break
        sleep 2
      done
      echo "enforced_after=$i last=$code"
      kubectl exec -n agentgateway-system deploy/ext-cache-enterprise-agentgateway -- redis-cli FLUSHALL
    assert:
      - contains: "last=429"
      - contains: "OK"

  - section: "Phase 1: exhaust the per-minute burst"
    run: [2]
    assert:
      - contains: "Request 1: HTTP 200"
      - contains: "HTTP 429"

  # The lab's point: the minute bucket resets but the hour counter did not, so
  # 200s return briefly and then 429 arrives sooner than in Phase 1. Phase 1
  # starts at the top of a minute, so its burst stays in one window and leaves
  # room in the 50-token hourly budget for at least one request here.
  - section: "Phase 2: minute resets, hour limit takes over"
    run: all
    assert:
      - contains: "Waiting for minute window to reset"
      - contains: "HTTP 200"
      - contains: "HTTP 429"

cleanup:
  section: "Cleanup"
