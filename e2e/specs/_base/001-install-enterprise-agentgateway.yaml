lab: 001-install-enterprise-agentgateway.md
description: Gateway API CRDs, Enterprise CRDs, controller + Solo UI, proxy Gateway, policies
tier: t0
requires:
  - SOLO_TRIAL_LICENSE_KEY
timeout: 1800

# Run by `--install-base`. There is deliberately no `cleanup:` — this lab IS the
# baseline every other lab depends on, so its Uninstall section is never run.
steps:
  - section: "Kubernetes Gateway API CRDs"
    run: all
    assert:
      - contains: "gatewayclasses"
      - contains: "httproutes"
      - contains: "referencegrants"

  - section: "Configure Required Variables"
    run: all

  # blocks: [1] create namespace  [2] helm crds  [3] api-resources check
  - section: "Enterprise Agentgateway CRDs"
    run: [1]
    allow_failure: true   # AlreadyExists when re-running against a live cluster

  - section: "Enterprise Agentgateway CRDs"
    run: [2, 3]
    assert:
      - contains: "enterpriseagentgatewaybackends"
      - contains: "enterpriseagentgatewaypolicies"
      - contains: "enterpriseagentgatewayparameters"
      - contains: "ratelimitconfigs"
      - contains: "authconfigs"

  # blocks: [1] helm install (controller + ui subchart)  [2] get pods. `helm upgrade -i`
  # returns before the ReplicaSet creates the pod, so block 2 can print "No resources found".
  - section: "Install Enterprise Agentgateway Controller"
    run: all
    retry:
      attempts: 20
      delay: 3
      until: 'enterprise-agentgateway-[a-z0-9]+-[a-z0-9]+'
    wait: "--for=condition=Available deploy/enterprise-agentgateway -n agentgateway-system --timeout=600s"
    assert:
      - matches: 'enterprise-agentgateway-[a-z0-9]+-[a-z0-9]+'

  # blocks: [1] rollout status + get pods
  - section: "Check the Solo UI"
    run: all
    wait: "--for=condition=Available deploy/enterprise-agentgateway-ui -n agentgateway-system --timeout=900s"
    assert:
      - contains: "successfully rolled out"

  # Later labs re-run `helm upgrade` with --reuse-values; this is the value they must carry.
  - probe: "the enterprise-agentgateway release has the ui subchart enabled"
    script: |
      helm get values enterprise-agentgateway -n agentgateway-system -o json \
        | jq -r '"ui_enabled=\(.ui.enabled) cost_management=\(.ui.features.costManagement)"'
    assert:
      - contains: "ui_enabled=true cost_management=true"

  - section: "Deploy Agentgateway with customizations"
    run: all
    wait: "--for=condition=Available deploy/agentgateway-proxy -n agentgateway-system --timeout=600s"

  - probe: "Gateway is Programmed and has an address"
    script: |
      for i in $(seq 1 30); do
        OUT="$(kubectl get gateway agentgateway-proxy -n agentgateway-system \
                 -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status} {.status.addresses[0].value}' 2>/dev/null)"
        [[ "$OUT" == True*[0-9a-z]* ]] && break
        sleep 5
      done
      echo "programmed=$OUT"
    assert:
      - matches: 'programmed=True [0-9a-z]'

  - probe: "the enterprise extension services are all running"
    script: |
      kubectl wait --for=condition=Available -n agentgateway-system \
        deploy/ext-auth-service-enterprise-agentgateway \
        deploy/ext-cache-enterprise-agentgateway \
        deploy/rate-limiter-enterprise-agentgateway \
        deploy/waf-server-enterprise-agentgateway \
        --timeout=600s
    assert:
      - rc: 0

  - section: "Configure metric labels"
    run: all

  - section: "Configure access logs (optional)"
    run: all

  - section: "Configure tracing"
    run: all

  - probe: "all three observability policies attached to the Gateway"
    script: |
      sleep 5
      kubectl get eagpol -n agentgateway-system metrics access-logs tracing \
        -o custom-columns='NAME:.metadata.name,ACCEPTED:.status.ancestors[0].conditions[?(@.type=="Accepted")].status'
    assert:
      - contains: "metrics"
      - contains: "access-logs"
      - contains: "tracing"
      - not_contains: "False"

  # With no modelCatalog source set, the UI must still show the built-in base catalog.
  - probe: "the Gateway parameters carry no modelCatalog source"
    script: |
      echo "sources=$(kubectl get enterpriseagentgatewayparameters agentgateway-config -n agentgateway-system \
        -o jsonpath='{.spec.modelCatalog.sources}')"
    assert:
      - contains: "sources="
      - not_contains: "model-cost-catalog"

  - section: "Access Solo UI"
    run: none
    reason: "`kubectl port-forward` in the foreground never returns; probed below"

  - probe: "Solo UI serves the app over its Service"
    script: |
      e2e_pf agentgateway-system svc/enterprise-agentgateway-ui 14000:80
      echo "solo_ui=$(curl -s -o /dev/null -w '%{http_code}' localhost:14000)"
      e2e_pf_stop
    assert:
      - contains: "solo_ui=200"

  - resource: svc/enterprise-agentgateway-ui-telemetry-collector
    jsonpath: ".spec.ports[?(@.port==4317)].port"
    expect: "4317"
    name: the OTEL collector that the tracing policy targets exists

  - section: "Uninstall"
    run: none
    reason: this lab is the baseline; tearing it down would break every other lab
