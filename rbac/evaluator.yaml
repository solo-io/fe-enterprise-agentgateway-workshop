apiVersion: v1
kind: Namespace
metadata:
  name: agw-evaluator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agw-evaluator
  namespace: agw-evaluator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agw-evaluator
rules:
  # Base install and every lab: lab namespaces
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Base install: chart CRDs (enterprise-agentgateway-crds, Gateway API); read by the controller preflight
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # All labs: Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - referencegrants
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # All labs: AgentgatewayPolicy and AgentgatewayModel
  - apiGroups:
      - agentgateway.dev
    resources:
      - agentgatewaypolicies
      - agentgatewaymodels
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # All labs: Enterprise Agentgateway policies, backends, budgets and rate limit configs
  - apiGroups:
      - enterpriseagentgateway.solo.io
    resources:
      - enterpriseagentgatewaybackends
      - enterpriseagentgatewaypolicies
      - enterpriseagentgatewaybudgets
      - enterpriseagentgatewayparameters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Rate limiting labs: RateLimitConfig
  - apiGroups:
      - ratelimit.solo.io
    resources:
      - ratelimitconfigs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # External auth labs: AuthConfig
  - apiGroups:
      - extauth.solo.io
    resources:
      - authconfigs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # WAF lab: WAFPolicy
  - apiGroups:
      - waf.solo.io
    resources:
      - wafpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # All labs: Services, ConfigMaps, and ServiceAccounts
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Base install (Helm release state) and every lab that creates credentials: Secrets
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # All labs: kubectl logs
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  # All labs: kubectl port-forward
  - apiGroups:
      - ""
    resources:
      - pods/portforward
    verbs:
      - create

  # All labs: kubectl wait and get on pods; detect-env reads nodes
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch

  # production-observability-alerting-and-scaling: kubectl get pdb
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch

  # Base install and every lab: Deployments (labs) and StatefulSets (the UI chart ClickHouse)
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # routing/timeouts-and-retries and mcp/mcp-guardrails: kubectl scale
  - apiGroups:
      - apps
    resources:
      - deployments/scale
    verbs:
      - get
      - update
      - patch

  # Monitoring chart (kube-prometheus-stack) and observability labs
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
      - prometheuses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Monitoring chart (kube-prometheus-stack): admission webhooks
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Base install: Gateway API CRD install ships ValidatingAdmissionPolicies
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Custom labs: the e2e leftover check lists PriorityClasses
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list

  # Monitoring chart (kube-prometheus-stack): pre-install admission hook Jobs
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Base install: Helm creates the chart Roles and RoleBindings, read for diffing and uninstall
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Base install: escalate and bind for the ClusterRoles and Roles the charts create (Kubernetes refuses to let an identity grant more than it holds). Names are stable for release name enterprise-agentgateway in agentgateway-system and grafana-prometheus in monitoring
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - roles
    resourceNames:
      - enterprise-agentgateway-ui-role-enterprise-agentgateway-agentgateway-system
      - enterprise-agentgateway-ui-k8sobjects-collector-enterprise-agentgateway-agentgateway-system
      - enterprise-agentgateway-api-agentgateway-system
      - enterprise-agentgateway-agentgateway-system
      - enterprise-agentgateway-agentgateway-system-deployer
      - grafana-prometheus-clusterrole
      - grafana-prometheus-kube-state-metrics
      - grafana-prometheus-kube-pr-operator
      - grafana-prometheus-kube-pr-prometheus
      - enterprise-agentgateway-ui-k8sobjects-collector-leases-enterprise-agentgateway-agentgateway-system
      - enterprise-agentgateway-ui-role-leases-enterprise-agentgateway-agentgateway-system
      - enterprise-agentgateway-agentgateway-system-local
      - grafana-prometheus
    verbs:
      - escalate
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agw-evaluator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agw-evaluator
subjects:
  - kind: ServiceAccount
    name: agw-evaluator
    namespace: agw-evaluator
