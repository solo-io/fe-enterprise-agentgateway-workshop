# -- Team name assigned by the platform team at onboarding. Sets the delegation
#    label (team: <name>) and the path prefix (/teams/<name>) for every endpoint.
team: ""

# -- Endpoints this team exposes through the gateway.
endpoints: []
#  - name: tools               # resource name suffix; URL becomes /teams/<team><path>
#    type: mcp
#    path: /mcp
#    toolMode: search          # optional: search | code
#    targets:
#      - name: github
#        host: github-mcp.team-alpha.svc.cluster.local
#        port: 8080
#        protocol: StreamableHTTP

# -- Namespace holding the platform team's parent route. The chart renders a
#    ReferenceGrant authorizing that namespace to delegate into this one.
platformNamespace: agentgateway-system
