{{- $seenAliases := list }}
{{- range .Values.modelCatalog }}
{{- if has .alias $seenAliases }}
{{- fail (printf "modelCatalog contains duplicate alias %q (aliases must be unique)" .alias) }}
{{- end }}
{{- $seenAliases = append $seenAliases .alias }}
{{- end }}
{{- $providers := dict "openai" "OpenAI" "anthropic" "Anthropic" }}
{{- range .Values.modelCatalog }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: llm-{{ .alias }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agentgateway-llm-ops.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-{{ .alias }}
  match:
    model: "*"
  provider: {{ get $providers .provider }}
  {{- with .baseURL }}
  baseURL: {{ . }}
  {{- end }}
  policies:
    auth:
      {{- if and .auth .auth.secretRef }}
      secretRef:
        name: {{ .auth.secretRef }}
      {{- else }}
      passthrough: {}
      {{- end }}
    # The alias pins its model, whatever the client sends.
    transformations:
      - field: model
        expression: {{ printf "%q" .model | squote }}
{{- end }}
