# -- Gateway owned by the platform team. All resources render into the release namespace.
#    Set to `null` (along with leaving modelCatalog unset) for a "grant-only" release: a
#    team-scoped install that renders ONLY that team's API-key Secret: no Gateway,
#    no parameters, no observability, no catalog, no budget resources. The infra
#    release's per-alias budget policy enforces the tier named in the key, so the
#    grant-only release must land in the same namespace as that infra release. Example:
#
#      gateway: null   # grant-only release: null out the chart's default infra;
#                      # this release carries only the grant
#
#      grants:
#        - team: team-gamma
#          key: gamma-secret-key
#          aliases:
#            - chat-real
#          budgetTier: large
#
#    WARNING: `gateway: null` is required, not optional -- a values file with only
#    `grants:` makes helm merge this default gateway block back in, rendering a second
#    Gateway/parameters/access-log set that fails with AlreadyExists next to an
#    existing infra release.
#
#    Because a grant-only release doesn't render modelCatalog or budgetTiers, it cannot
#    validate its aliases or tier -- an alias with no matching catalog entry is not an
#    error (its label is inert until an infra release with that alias shows up in the
#    same namespace), and a tier with no matching budgetTiers entry gets the first tier.
gateway:
  name: agw-llm-ops
  gatewayClassName: enterprise-agentgateway
  listeners:
    http:
      port: 8080

# -- Proxy fleet shape (rendered as EnterpriseAgentgatewayParameters <gateway.name>-config)
proxy:
  replicas: 2
  service:
    type: LoadBalancer

observability:
  # -- Proxy log level (info|debug|warn|error)
  logging:
    level: info
  accessLog:
    enabled: true
    # -- Extra attributes recorded on every access log entry (CEL expressions)
    attributes:
      - name: llm.streaming
        expression: llm.streaming

# -- Model catalog: the aliases the platform operates. Each alias becomes a stable
#    endpoint /llm/<alias> backed by a platform-managed provider and model.
#    Teams never see the provider, the model, or the credentials behind an alias,
#    so the platform can swap any of them without any team changing anything.
modelCatalog: []
#  - alias: chat-mock          # LLM-shaped endpoint for tests/CI; no provider cost
#    provider: openai
#    model: mock-model
#    baseURL: http://mock-model-svc.agentgateway-system.svc.cluster.local:8000/v1
#  - alias: chat-real          # real completions; provider is a platform decision
#    provider: openai
#    model: gpt-5.4-nano
#    auth:
#      secretRef: openai-secret   # platform-held provider credential (pre-created Secret)

# -- Budget tiers: named token-per-minute limits the platform offers. The infra
#    release renders one RateLimitConfig for all tiers and one budget policy per
#    alias route. Each team on a tier gets its own counter at that tier's limit.
#    A key with a missing or unknown tier gets the FIRST tier, so list the smallest first.
budgetTiers: []
#  - name: small
#    tokensPerMinute: 5
#  - name: large
#    tokensPerMinute: 1000

# -- Grants: which team may call which aliases, on which budget tier.
#    Each entry mints the team's API key Secret, adds it to the key set of every
#    granted alias, and records the team's budget tier in the key's metadata.
#    Keys are inline for workshop use; production platforms source them from an
#    external secret manager (e.g. External Secrets Operator).
grants: []
#  - team: team-alpha
#    key: alpha-key-8f3a
#    aliases:
#      - chat-real
#      - chat-mock
#    budgetTier: large
